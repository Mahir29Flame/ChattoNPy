[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chattonpy"
version = "1.2.7"
description = "A simple python CLI chat interface and a python module for Gemini API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
]

# This creates the command in the terminal!
[project.scripts]
ChattoNPy = "chattonpy.main:cli"
